<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das Wesen</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --rand: #252a31; --text: #e6e6e6; --leise: #8a929c;
    --akzent: #9fd3c7; --mensch: #2b3a55; --wesen: #1e2a27; --traum: #b49de0; --reflex: #e8c07d;
    --selbst: #f08a8a; --stoer: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--rand); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .info { color: var(--leise); font-size: 13px; }
  .puls { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--akzent);
          margin-right: 6px; animation: puls 2.4s ease-in-out infinite; }
  .schlaf .puls { background: var(--traum); animation-duration: 6s; }
  @keyframes puls { 50% { opacity: .25; transform: scale(.8); } }
  main { flex: 1; display: grid; grid-template-columns: 1.1fr 1fr 300px; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rand); }
  section h2, aside h2 { margin: 0; padding: 10px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--leise); }
  .liste { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .msg { padding: 8px 12px; border-radius: 10px; margin: 6px 0; max-width: 90%; white-space: pre-wrap; }
  .msg.mensch { background: var(--mensch); margin-left: auto; }
  .msg.wesen { background: var(--wesen); }
  .msg.spontan { border: 1px dashed var(--akzent); }
  .strom div { padding: 6px 0; border-bottom: 1px solid #1b1f25; white-space: pre-wrap; font-size: 14px; }
  .strom .zeit { color: var(--leise); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .t-gedanke { color: #cfd6dd; }
  .t-traum { color: var(--traum); font-style: italic; }
  .t-reflexion { color: var(--reflex); }
  .t-selbstveraenderung { color: var(--selbst); }
  .t-handlung, .t-zustand { color: var(--leise); font-size: 13px !important; }
  .t-tagebuch { color: var(--akzent); }
  .t-stoerung { color: var(--stoer); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rand); }
  textarea { flex: 1; resize: none; height: 44px; background: var(--panel); color: var(--text); border: 1px solid var(--rand);
             border-radius: 8px; padding: 10px; font: inherit; }
  button { background: var(--akzent); color: #0d0f12; border: 0; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  aside { overflow-y: auto; padding: 0 16px 16px; }
  aside h2 { padding: 10px 0 !important; margin-top: 6px; }
  .trieb { margin: 8px 0; font-size: 13px; }
  .balken { height: 6px; background: var(--rand); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .balken i { display: block; height: 100%; background: var(--akzent); transition: width .8s; }
  .selbst dt { color: var(--leise); font-size: 12px; margin-top: 10px; }
  .selbst dd { margin: 2px 0 0; font-size: 14px; }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; grid-auto-rows: minmax(320px, auto); overflow-y: auto; }
    section { border-right: 0; border-bottom: 1px solid var(--rand); }
  }
</style>
</head>
<body>
<header>
  <h1><span class="puls"></span><span id="name">Das Wesen</span></h1>
  <span class="info" id="info">verbinde…</span>
</header>
<main>
  <section>
    <h2>Gespräch</h2>
    <div class="liste" id="chat"></div>
    <form id="form">
      <textarea id="eingabe" placeholder="Sag etwas… (Enter zum Senden)"></textarea>
      <button id="senden">Senden</button>
    </form>
  </section>
  <section>
    <h2>Bewusstseinsstrom</h2>
    <div class="liste strom" id="strom"></div>
  </section>
  <aside>
    <h2 style="padding-left:0">Triebe</h2>
    <div id="triebe"></div>
    <h2 style="padding-left:0">Selbstbild</h2>
    <dl class="selbst" id="selbst"></dl>
  </aside>
</main>
<script>
let seit = 0;
const $ = id => document.getElementById(id);
const fmt = t => new Date(t * 1000).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});

function blase(text, klasse) {
  const d = document.createElement("div");
  d.className = "msg " + klasse;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function strom(e) {
  const unten = $("strom").scrollHeight - $("strom").scrollTop - $("strom").clientHeight < 60;
  const d = document.createElement("div");
  d.className = "t-" + e.typ;
  const z = document.createElement("span");
  z.className = "zeit";
  z.textContent = fmt(e.zeit) + " " + e.typ;
  d.appendChild(z);
  d.appendChild(document.createTextNode(e.text));
  $("strom").appendChild(d);
  if (unten) $("strom").scrollTop = $("strom").scrollHeight;
}

function zeigen(z) {
  for (const e of z.ereignisse) {
    seit = Math.max(seit, e.id);
    if (e.typ === "mensch") blase(e.text, "mensch");
    else if (e.typ === "antwort") blase(e.text, "wesen");
    else if (e.typ === "nachricht") { blase(e.text, "wesen spontan"); strom(e); }
    else strom(e);
  }
  const s = z.selbst;
  $("name").textContent = s.name || "Das Wesen (noch namenlos)";
  document.body.classList.toggle("schlaf", z.schlaeft);
  const k = z.koerper;
  $("info").textContent = [z.schlaeft ? "schläft" : "wach", z.modell, `${z.erinnerungen} Erinnerungen`,
    `${s.erwachungen}× erwacht`, k.gpu ? `GPU ${k.gpu.last}% · ${k.gpu.temperatur}°C` : null].filter(Boolean).join(" · ");
  $("triebe").innerHTML = "";
  for (const [n, w] of Object.entries(z.triebe)) {
    const d = document.createElement("div");
    d.className = "trieb";
    d.innerHTML = `<span></span><div class="balken"><i style="width:${Math.round(w * 100)}%"></i></div>`;
    d.firstChild.textContent = n[0].toUpperCase() + n.slice(1);
    $("triebe").appendChild(d);
  }
  const felder = {wer_ich_glaube_zu_sein: "Wer ich glaube zu sein", stimmung: "Stimmung", werte: "Werte",
    ziele: "Ziele", offene_fragen: "Offene Fragen", beziehung_zum_menschen: "Beziehung zum Menschen"};
  $("selbst").innerHTML = "";
  for (const [f, titel] of Object.entries(felder)) {
    const dt = document.createElement("dt"); dt.textContent = titel;
    const dd = document.createElement("dd");
    const w = s[f];
    dd.textContent = Array.isArray(w) ? (w.length ? "• " + w.join("\n• ") : "–") : (w || "–");
    dd.style.whiteSpace = "pre-wrap";
    $("selbst").append(dt, dd);
  }
}

async function abfragen() {
  try {
    const r = await fetch("/api/zustand?seit=" + seit);
    zeigen(await r.json());
  } catch (e) {
    $("info").textContent = "keine Verbindung zum Wesen";
  }
  setTimeout(abfragen, 1500);
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = $("eingabe").value.trim();
  if (!text) return;
  $("eingabe").value = "";
  $("senden").disabled = true;
  $("senden").textContent = "…";
  try {
    const r = await fetch("/api/nachricht", {method: "POST", headers: {"Content-Type": "application/json"},
                                           body: JSON.stringify({text})});
    const d = await r.json();
    if (d.fehler) blase("Störung: " + d.fehler, "wesen");
  } finally {
    $("senden").disabled = false;
    $("senden").textContent = "Senden";
  }
});
$("eingabe").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); }
});
abfragen();
</script>
</body>
</html>
